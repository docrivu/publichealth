name: Sync from WordPress

# Copies the live WordPress pages back into wordpress/pages/ so GitHub always
# holds the latest version — including edits made directly in wp-admin.
# Runs every night, and on demand from the Actions tab.

on:
  schedule:
    - cron: "17 20 * * *"   # 01:47 IST daily
  workflow_dispatch:

concurrency:
  group: deploy-site        # never runs at the same time as a deploy
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Export pages from WordPress
        env:
          WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          WP_ALLOW_INSECURE_TLS: ${{ secrets.WP_ALLOW_INSECURE_TLS || 'false' }}
        run: npm run wp:export

      - name: Commit changes, if any
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain wordpress)" ]; then
            echo "WordPress and GitHub already match."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wordpress
          git commit -m "Sync pages from WordPress"
          git push
